name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Two pushes in quick succession would otherwise race two `terraform apply`
# runs against the same state. Queue instead — and never cancel a deploy
# mid-apply, which is why cancel-in-progress is false.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=lambda_handler --cov-report=json:coverage.json

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          retention-days: 7

  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install lint tooling
        run: pip install -r requirements/dev.txt

      # BLOCKING. Safe to block a deploy on: a failed deploy just leaves the
      # previous working version running on its cron, so the account keeps
      # publishing. Rule set is deliberately narrow (see pyproject.toml).
      - name: ruff
        run: ruff check --output-format=github .

      # BLOCKING on HIGH severity only (-lll). Currently zero HIGH findings.
      # There are 22 MEDIUM — 19 of them `requests` calls with no timeout,
      # which is a real reliability bug in a Lambda on a 15-minute hard limit,
      # but fixing 19 call sites in the publishing path is its own change.
      # Blocking at -ll today would just mean this gate gets switched off.
      - name: bandit (blocking - HIGH only)
        run: bandit -c pyproject.toml -r src/ lambda_handler.py token_refresher.py -lll

      # The MEDIUM/LOW findings, visible but not blocking, so they can ratchet.
      - name: bandit (report - MEDIUM and below)
        continue-on-error: true
        run: bandit -c pyproject.toml -r src/ lambda_handler.py token_refresher.py -ll

      # NOT blocking: a CVE disclosed in a transitive dependency is not a
      # reason to stop shipping an unrelated production fix. It still shows
      # as a failed step in the run summary.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements/base.txt --desc

  code-quality:
    name: Code Quality Metrics
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install metric tooling
        run: pip install -r requirements/dev.txt boto3

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Analyse
        run: |
          python scripts/code_quality/analyze.py . \
            --coverage-json coverage.json \
            -o code_quality.json

      # PRs get the table in the log for review; nothing is stored or mailed.
      - name: Report (pull request)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python scripts/code_quality/gate.py code_quality.json

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      # DELIBERATELY NON-BLOCKING, and `deploy` does not depend on this job.
      # Every push to main auto-deploys with no approval and no rollback;
      # gating that on a ratchet metric would let one legitimate refactor
      # block a production fix. The requested behaviour is an email.
      - name: Compare, record and alert on regression
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: eu-central-1
        run: |
          # The SNS topic ARN is derived from STS + the Terraform-defined topic
          # name rather than stored as a repo secret, so there is no second
          # place for it to drift out of sync with the infrastructure.
          python scripts/code_quality/gate.py code_quality.json \
            --bucket news-ai-agent-results-645949963620 \
            --append \
            --publish

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: code-quality
          path: code_quality.json
          retention-days: 30

  deploy:
    name: Build & Deploy
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Lambda ZIP
        run: bash scripts/build_lambda.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.0"

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve -var-file=terraform.tfvars.ci

      # Proves the deployed code actually loads. terraform apply only confirms the ZIP
      # was uploaded — a broken import or handler stays green until the next cron fires,
      # up to 13 hours later. This catches it here, in under a minute.
      #
      # This step REQUIRES the deployed code to handle the health_check payload: code
      # without that branch falls through to the news pipeline and publishes. If you
      # ever revert main below the commit that introduced it, drop this step too.
      - name: Smoke test deployed Lambda
        run: |
          set -euo pipefail

          # Block until the new code is actually live. terraform apply can return while
          # the update is still propagating, and invoking during that window runs the
          # OLD code — which does not know the health_check payload and would fall
          # through to the news pipeline, publishing an unscheduled post.
          aws lambda wait function-updated --function-name news-ai-agent

          aws lambda invoke \
            --function-name news-ai-agent \
            --payload "$(printf '{"health_check":true}' | base64)" \
            --cli-read-timeout 120 \
            response.json > invoke.json

          echo "Invoke metadata:"; cat invoke.json
          echo "Response:"; cat response.json

          python - <<'PY'
          import json, sys

          meta = json.load(open("invoke.json"))
          if meta.get("FunctionError"):
              sys.exit(f"::error::Deployed Lambda raised on a health check "
                       f"({meta['FunctionError']}) — the deploy is broken.")

          body = json.loads(json.load(open("response.json"))["body"])
          if body.get("status") != "healthy":
              sys.exit(f"::error::Health check returned {body!r} — the deploy is broken.")

          print("✅ Deployed Lambda is healthy")
          PY
