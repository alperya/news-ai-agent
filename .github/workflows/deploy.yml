name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Build & Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Lambda ZIP
        run: bash scripts/build_lambda.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.0"

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve -var-file=terraform.tfvars.ci

      # Proves the deployed code actually loads. terraform apply only confirms the ZIP
      # was uploaded — a broken import or handler stays green until the next cron fires,
      # up to 13 hours later. This catches it here, in under a minute.
      #
      # This step REQUIRES the deployed code to handle the health_check payload: code
      # without that branch falls through to the news pipeline and publishes. If you
      # ever revert main below the commit that introduced it, drop this step too.
      - name: Smoke test deployed Lambda
        run: |
          set -euo pipefail

          # Block until the new code is actually live. terraform apply can return while
          # the update is still propagating, and invoking during that window runs the
          # OLD code — which does not know the health_check payload and would fall
          # through to the news pipeline, publishing an unscheduled post.
          aws lambda wait function-updated --function-name news-ai-agent

          aws lambda invoke \
            --function-name news-ai-agent \
            --payload "$(printf '{"health_check":true}' | base64)" \
            --cli-read-timeout 120 \
            response.json > invoke.json

          echo "Invoke metadata:"; cat invoke.json
          echo "Response:"; cat response.json

          python - <<'PY'
          import json, sys

          meta = json.load(open("invoke.json"))
          if meta.get("FunctionError"):
              sys.exit(f"::error::Deployed Lambda raised on a health check "
                       f"({meta['FunctionError']}) — the deploy is broken.")

          body = json.loads(json.load(open("response.json"))["body"])
          if body.get("status") != "healthy":
              sys.exit(f"::error::Health check returned {body!r} — the deploy is broken.")

          print("✅ Deployed Lambda is healthy")
          PY
